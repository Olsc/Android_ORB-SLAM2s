plugins {
    id 'com.android.library'
}

// SDK 对外接口层(Apache-2.0 / GPLv3 双许可)：
// 仅包含 AIDL 与共享内存客户端，App 与 GPL 实现模块的唯一边界。
android {
    namespace 'com.orb.slam2s.ipc.sdk'
    compileSdk 37
    compileSdkMinor 1
    buildToolsVersion '37.0.0'

    defaultConfig {
        minSdk 23
        targetSdk 37
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}