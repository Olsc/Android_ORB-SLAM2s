buildscript {
    ext {
        agp_version = '9.4.1'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// 清理 CMake 的 .cxx 外部构建缓存：更换 NDK/CMake 参数后必须重新生成。
// 必须排在 AGP 的 ninja clean 之后，否则找不到 build.ninja。
def cxxCacheDirs = subprojects.collect { new File(it.projectDir, '.cxx') } + new File(rootDir, '.cxx')
def nativeCleanTasks = subprojects.collect { p ->
    p.tasks.matching { t -> t.name.startsWith('externalNativeBuildClean') || t.name == 'clean' }
}

tasks.register("cleanCxx") {
    mustRunAfter nativeCleanTasks
    doLast {
        cxxCacheDirs.each { dir ->
            if (dir.exists()) {
                project.delete(dir)
                logger.lifecycle("cleanCxx: 已删除 " + dir)
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete layout.buildDirectory
    finalizedBy "cleanCxx"
}

// 各子模块 clean 完成后同样清掉 .cxx
subprojects {
    tasks.configureEach { t ->
        if (t.name == 'clean' || t.name.startsWith('externalNativeBuildClean')) {
            t.finalizedBy rootProject.tasks.named('cleanCxx')
        }
    }
}
