plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.orb.slam2s"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "0.0.4"

        multiDexEnabled true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            excludes += ['lib/x86/**', 'lib/x86_64/**']
            pickFirsts += ['lib/armeabi-v7a/libopencv_java4.so', 'lib/arm64-v8a/libopencv_java4.so', 'lib/**/libc++_shared.so']
        }
        resources {
            excludes += [
                'lib/x86/**', 
                'lib/x86_64/**', 
                '**/DebugProbesKt.bin',
                '**/kotlin/**',
                '**/*.kotlin_metadata',
                '**/*.kotlin_builtins',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    aaptOptions {
        noCompress "tflite", "mindir", "obj", "mtl"
    }

    sourceSets {

    }

    // 加载签名密钥
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['keystore.path'])
                storePassword keystoreProps['keystore.password']
                keyAlias keystoreProps['key.alias']
                keyPassword keystoreProps['key.password']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.orb.slam2s'
    buildToolsVersion '37.0.0'
    compileSdkMinor 1

    //dynamicFeatures = [":slam"]
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'de.javagl:obj:0.4.0'
    implementation project(':OpenCVLibrary')
    implementation project(':VtonaxAR')

    // CameraX
    implementation 'androidx.camera:camera-core:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'com.google.guava:guava:33.6.0-android'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21"
        force "org.jetbrains.kotlin:kotlin-stdlib:2.3.21"
    }
}

tasks.configureEach { task ->
    if (task.name.contains('lintAnalyze') || task.name.contains('lintVitalAnalyze') || task.name == 'lint') {
        task.enabled = false
    }
}
