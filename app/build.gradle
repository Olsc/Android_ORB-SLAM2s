plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.orb.slam2s"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -frtti -fexceptions"
                arguments "-DANDROID_ARM_NEON=TRUE",
                        "-DANDROID_TOOLCHAIN=clang",
                        "-DBUILD_FAT_JAVA_LIBS=ON",
                        "-DANDROID_STL=c++_shared"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            excludes += ['lib/x86/**', 'lib/x86_64/**']
            pickFirsts += ['lib/armeabi-v7a/libopencv_java4.so', 'lib/arm64-v8a/libopencv_java4.so', 'lib/**/libc++_shared.so']
        }
        resources {
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
    }

    aaptOptions {
        noCompress "tflite", "mindir", "obj", "mtl"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    buildFeatures {
        buildConfig = true
    }



    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version '4.1.2'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.orb.slam2s'
    buildToolsVersion '37.0.0 rc1'
    compileSdkMinor 1

    //dynamicFeatures = [":slam"]
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.preference:preference:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'de.javagl:obj:0.4.0'
    testImplementation 'junit:junit:4.13.2'
    implementation project(':OpenCVLibrary')

    // CameraX
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'com.google.guava:guava:33.5.0-android'
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.10"
        force "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"
    }
}
