name: Submodule Auto Update

# 定期检查所有 git 子模块（submodule）是否有上游更新；
# 若有更新则自动拉取并创建 / 更新一个 Pull Request。
#
# 本工作流只负责 “检查 + 更新 + 提交 PR”，不做任何编译。
# 编译 / 打包测试由已有的 Android CI（.github/workflows/android.yml）负责。
#
# ⚠️ 重要：使用默认 GITHUB_TOKEN 创建的 PR 不会触发其它 workflow 的
#    pull_request 事件（GitHub 防止递归），所以本工作流自动开的 PR
#    **不会**自动跑 Android CI。
#    如需让自动 PR 触发 Android CI（从而自动完成编译测试），请创建
#    一个 PAT（classic：勾选 repo + workflow；或 fine-grained：给本仓库
#    Contents=Read/Write、Pull requests=Read/Write、Workflows=Write），
#    保存为 secret `SUBMODULE_PR_TOKEN`。本工作流会自动优先使用它。
#
# 子模块跟踪的分支由 `.gitmodules` 里的 `submodule.<name>.branch` 决定；
# 未配置时使用子模块远程仓库的默认分支（remote HEAD）。
# ⚠️ opencv 上游默认分支已是 5.x，本仓库使用 4.x，
#    因此 .gitmodules 中显式固定了 `branch = 4.x`，请勿随意删除。

on:
  schedule:
    # 每周一 03:17 UTC 检查一次（错开整点，降低 GitHub 高峰延迟）
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      submodules:
        description: "只检查这些子模块（逗号/空格分隔；留空 = 全部）"
        required: false
        default: ""
      base_branch:
        description: "PR 的目标分支（留空 = 仓库默认分支）"
        required: false
        default: ""

# 需要写权限：推送自动更新分支、创建 PR、写入标签
permissions:
  contents: write
  pull-requests: write
  issues: write

# 同一时间只允许一个更新任务，避免并发创建冲突的 PR
concurrency:
  group: submodule-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Check submodules & open PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_BRANCH: ${{ github.event.inputs.base_branch || github.event.repository.default_branch || 'main' }}
      SUBMODULE_FILTER: ${{ github.event.inputs.submodules || '' }}
      # 可选 PAT：用于让自动创建的 PR 触发 Android CI 等其它 workflow
      PR_TOKEN: ${{ secrets.SUBMODULE_PR_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          # 子模块交由 update_submodules.sh 以浅克隆方式拉取，节省磁盘/时间
          submodules: false
          token: ${{ env.PR_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update submodules to upstream tips
        id: update
        run: |
          chmod +x docs/update_submodules.sh
          docs/update_submodules.sh \
            --filter "${SUBMODULE_FILTER}" \
            --depth 1 \
            --summary-file "${RUNNER_TEMP}/submodule-pr-body.md" \
            --paths-file "${RUNNER_TEMP}/submodule-paths.txt" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Show staged changes
        if: steps.update.outputs.changed == 'true'
        run: git --no-pager diff --cached --submodule=log

      - name: Append PR footer
        if: steps.update.outputs.changed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="${RUNNER_TEMP}/submodule-pr-body.md"
          {
            echo ""
            echo "---"
            echo "*此描述由 GitHub Actions 自动生成 · [运行记录](${RUN_URL})*"
            echo ""
            echo "> 依赖 PR 的编译 / 打包测试由 Android CI 处理；"
            echo "> 若本 PR 未自动触发 CI，请确认已配置 \`SUBMODULE_PR_TOKEN\`。"
          } >> "$BODY"

      - name: Ensure PR labels exist
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: |
          gh label create dependencies --color 0366d6 --description "Dependency updates" 2>/dev/null || true
          gh label create submodules   --color 5319e7 --description "Git submodule updates" 2>/dev/null || true

      - name: Create or update Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ env.PR_TOKEN }}
          base: ${{ env.BASE_BRANCH }}
          branch: chore/submodule-auto-update
          delete-branch: true
          # 只提交发生变化的子模块 gitlink，避免把其它文件带入提交
          add-paths: ${{ steps.update.outputs.paths }}
          commit-message: |
            chore(submodules): update to latest upstream commits

            Automated by .github/workflows/submodule-auto-update.yml
          title: "chore(submodules): 自动更新子模块到最新提交"
          body-path: ${{ runner.temp }}/submodule-pr-body.md
          labels: |
            dependencies
            submodules
